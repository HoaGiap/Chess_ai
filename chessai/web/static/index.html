<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess_ai</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="app">
  <section class="board-area" id="board-area">
    <div class="board" id="board">
      <div class="squares" id="squares"></div>
      <div class="pieces" id="pieces"></div>
      <div class="picker" id="picker" hidden></div>
    </div>
  </section>
  <aside class="panel">
    <header class="panel-head">
      <span class="brand">Chess_ai</span>
      <button id="theme" class="icon-btn" title="Đổi nền sáng/tối">&#9680;</button>
    </header>

    <nav class="tabs" id="tabs">
      <button data-view="home" class="on">Chơi</button>
      <button data-view="lobby">Phòng</button>
    </nav>

    <section class="view" id="view-home">
      <div class="home">
        <button id="play-ai" class="primary">Chơi với máy</button>
        <button id="play-rooms">Chơi với người</button>
        <button id="play-both">Hai bên</button>
      </div>
    </section>

    <section class="view" id="view-lobby" hidden>
      <div class="lobby">
        <button id="make-room" class="primary">Tạo phòng</button>
        <div class="join-row">
          <input id="room-code" placeholder="mã phòng" maxlength="8" autocomplete="off">
          <button id="join-code">Vào</button>
        </div>
        <ul class="room-list" id="room-list"></ul>
      </div>
    </section>

    <section class="view" id="view-room" hidden>
      <div class="waiting">
        <p class="room-code" id="room-code-big">—</p>
        <ul class="seats">
          <li><span class="dot white"></span> Trắng: <b id="seat-white">trống</b></li>
          <li><span class="dot black"></span> Đen: <b id="seat-black">trống</b></li>
        </ul>
        <div class="invite-row">
          <input id="invite" readonly aria-label="link phòng">
          <button id="copy-invite">Sao chép link</button>
        </div>
        <p class="note" id="room-note"></p>
        <p class="note">Mọi phòng nằm trong bộ nhớ máy chủ: tắt máy chủ là mất
          hết phòng, và phòng không chạy được trên nhiều tiến trình cùng lúc.</p>
        <button id="start-room" class="primary" disabled>Bắt đầu</button>
      </div>
    </section>

    <div class="player" id="player-top">
      <span class="dot black"></span>
      <div>
        <strong>Đen</strong>
        <small id="top-sub">—</small>
        <small id="top-elo"></small>
      </div>
      <span class="captured" id="top-captured"></span>
    </div>
    <div class="player" id="player-bottom">
      <span class="dot white"></span>
      <div>
        <strong>Trắng</strong>
        <small id="bottom-sub">—</small>
        <small id="bottom-elo"></small>
      </div>
      <span class="captured" id="bottom-captured"></span>
    </div>
    <p class="message" id="message"></p>
    <p class="room-status" id="room-status" hidden></p>
    <ol class="moves" id="moves"></ol>
    <div class="actions">
      <button id="undo">Lùi 1 lượt</button>
      <button id="resign" hidden>Đầu hàng</button>
      <button id="leave-room" hidden>Rời phòng</button>
      <button id="forfeit" hidden>Đối thủ mất kết nối — kết thúc ván</button>
      <button id="rematch" hidden>Chơi lại</button>
      <button id="flip">Lật bàn</button>
      <button id="pgn">Tải PGN</button>
      <button id="new" class="primary">Ván mới</button>
    </div>
    <div class="setup" id="setup" hidden>
      <div class="setup-row">
        <span class="setup-label">Bạn đánh phe</span>
        <div class="seg" id="pick-color">
          <button data-color="white" class="on">Trắng</button>
          <button data-color="black">Đen</button>
          <button data-color="both">Hai bên</button>
        </div>
      </div>
      <div class="setup-row">
        <span class="setup-label">Elo máy <b id="elo-value">1200</b></span>
        <input type="range" id="elo" min="600" max="2400" step="100" value="1200">
      </div>
      <button id="start" class="primary">Bắt đầu</button>
    </div>
  </aside>
</main>
<!-- type="module" là BẮT BUỘC: app.js dùng top-level await ở cuối file.
     Nạp như classic script sẽ ném SyntaxError và cả trang chết. -->
<script type="module" src="/static/app.js"></script>
</body>
</html>
